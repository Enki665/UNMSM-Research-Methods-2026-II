experiment: smoke
model: Qwen/Qwen2.5-0.5B

data:
  dataset: nyu-mll/glue
  subset: sst2
  text_field: sentence
  label_field: label
  num_labels: 2
  train_split: train
  eval_split: validation
  max_train_samples: 500
  max_eval_samples: 200
  max_length: 128

adaptation:
  bits: 4
  rank: 8
  alpha_ratio: 2
  dropout: 0.05
  target_modules: attn

training:
  epochs: 1
  batch_size: 8
  learning_rate: 2.0e-4
  gradient_checkpointing: false

measurement:
  latency_samples: 50
  latency_warmup: 5

seed: 42
